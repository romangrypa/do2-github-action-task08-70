name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Run Tests on Ubuntu
    runs-on: ubuntu-latest # Select an operating system

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          
      # Verify installed software
      - name: Verify Java and Maven
        run: |
          java --version
          mvn --version

      - name: Build and Run Unit Tests with Maven
        run: mvn clean test